
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | ShopNear AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="shopkeeper-page">

    <header class="shopkeeper-header">
        <a href="{{ url_for('shopkeeper_dashboard') }}"
           class="shopkeeper-logo">
            ShopNear AI
        </a>

        <nav class="shopkeeper-nav">
            <a href="{{ url_for('my_products') }}">My Products</a>
            <a href="{{ url_for('logout') }}"
               class="shopkeeper-logout">Logout</a>
        </nav>
    </header>

    <main class="shopkeeper-dashboard">

        <section class="shopkeeper-welcome">
            <div>
                <p class="shopkeeper-label">PRODUCT MANAGEMENT</p>
                <h1>Edit Product</h1>
                <p>Update your product information below.</p>
            </div>
        </section>

        <section class="shopkeeper-section">

            <div class="shopkeeper-card">

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <label>Product Name *</label>
                    <input type="text" name="name"
                           value="{{ product['name'] }}" required>

                    <label>Category *</label>
                    <input type="text" name="category"
                           value="{{ product['category'] }}" required>

                    <label>Price (₹) *</label>
                    <input type="number" name="price"
                           value="{{ product['price'] }}"
                           min="0.01" step="0.01" required>

                    <label>Shop Name *</label>
                    <input type="text" name="shop"
                           value="{{ product['shop'] }}" required>

                    <label>Shop Location *</label>
                    <input type="text" name="location"
                           value="{{ product['location'] }}" required>

                    <label>Available Stock *</label>
                    <input type="number" name="stock"
                           value="{{ product['stock'] }}"
                           min="0" step="1" required>

                    <label>Product Description</label>
                    <textarea name="description" rows="4">{{ product['description'] or '' }}</textarea>
                    <label>Product Image Filename</label>
<input type="text" name="image"
       value="{{ product['image'] or '' }}"
       placeholder="Example: usb_c_cable.jpg">

                    <button type="submit"
                            class="shopkeeper-primary-btn">
                        Save Changes
                    </button>

                    <a href="{{ url_for('my_products') }}">
                        Cancel
                    </a>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
