<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | ShopNear AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="shopkeeper-page">

    <header class="shopkeeper-header">
        <a href="{{ url_for('shopkeeper_dashboard') }}"
           class="shopkeeper-logo">
            ShopNear AI
        </a>

        <nav class="shopkeeper-nav">
            <a href="{{ url_for('shopkeeper_dashboard') }}">
                Dashboard
            </a>
            <a href="{{ url_for('logout') }}"
               class="shopkeeper-logout">
                Logout
            </a>
        </nav>
    </header>

    <main class="shopkeeper-dashboard">

        <section class="shopkeeper-welcome">
            <div>
                <p class="shopkeeper-label">PRODUCT MANAGEMENT</p>
                <h1>Add a New Product</h1>
                <p>Enter your product details below.</p>
            </div>
        </section>

        <section class="shopkeeper-section">

            <div class="shopkeeper-card">

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <label>Product Name *</label>
                    <input type="text" name="name" required>

                    <label>Category *</label>
                    <input type="text" name="category" required>

                    <label>Price (₹) *</label>
                    <input type="number" name="price"
                           min="0.01" step="0.01" required>

                    <label>Shop Name *</label>
                    <input type="text" name="shop"
       value="{{ shop['shop_name'] if shop else '' }}"
       placeholder="Enter your shop name" required>

                    <label>Shop Location *</label>
                    <input type="text" name="location"
       value="{{ shop['location'] if shop else '' }}"
       placeholder="Enter your city or area" required>

                    <label>Available Stock *</label>
                    <input type="number" name="stock"
                           min="0" step="1" required>

                    <label>Product Description</label>
                    <textarea name="description"
                              rows="4"></textarea>
                              <label>Product Image Filename</label>
                <input type="text" name="image"
                placeholder="Example: mouse.jpg">
                    <button type="submit"
                            class="shopkeeper-primary-btn">
                        Add Product
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
